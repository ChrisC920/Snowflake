included:
  - Snowflake
  - Packages/SnowflakeKit/Sources
  - Packages/SnowflakeKit/Tests
excluded:
  - build
  - Packages/SnowflakeKit/.build
  - .claude

opt_in_rules:
  - empty_count
  - first_where
  - modifier_order
  - redundant_nil_coalescing
  - sorted_imports
  - toggle_bool

disabled_rules:
  - todo
  - trailing_comma # SwiftFormat owns commas

line_length:
  warning: 140
  error: 200
  ignores_comments: true
  ignores_urls: true

identifier_name:
  excluded: [id, a, b, c, s, x, y]

type_body_length:
  warning: 300

analyzer_rules:
  - unused_import
