name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  policy:
    name: Policy
    # Guardrails for agent PRs (branches agent/issue-N): no protected paths, no removed
    # tests, no new lint or test suppressions. Human PRs pass straight through. The checker
    # runs from the PR's *base* commit, so a PR can't weaken its own policy.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out policy (base commit)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          sparse-checkout: .github/agent
          path: _base
          persist-credentials: false
      - name: Check out PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: head
          fetch-depth: 0
          persist-credentials: false
      - name: Agent policy
        env:
          HEAD_REF: ${{ github.head_ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ ! -f _base/.github/agent/agentctl.py ] || [ -z "$BASE_SHA" ]; then
            echo "No agent policy on the base commit (or not a PR): nothing to check."; exit 0
          fi
          python3 _base/.github/agent/agentctl.py policy --repo-dir head --base "$BASE_SHA" --head "$HEAD_SHA"

  agent-tooling:
    name: Agent tooling
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: agentctl unit tests
        run: python3 -m unittest discover -s .github/agent -p 'test_*.py' -v

  lint:
    name: Lint
    runs-on: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: latest-stable
      - name: Install tools
        run: brew install swiftlint swiftformat
      - name: SwiftLint
        run: swiftlint lint --strict --reporter github-actions-logging
      - name: SwiftFormat
        run: swiftformat . --lint

  test:
    name: Test
    runs-on: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: latest-stable
      - name: Xcode version (cache key)
        id: xcode
        run: echo "version=$(xcodebuild -version | tr '\n' ' ' | tr -cs 'A-Za-z0-9.' '-')" >> "$GITHUB_OUTPUT"
      - name: Restore SwiftPM cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: Packages/SnowflakeKit/.build
          key: spm-${{ steps.xcode.outputs.version }}-${{ github.sha }}
          restore-keys: spm-${{ steps.xcode.outputs.version }}-
      - name: Package tests
        working-directory: Packages/SnowflakeKit
        run: swift test
      - name: Save SwiftPM cache
        # Only trusted pushes to main write caches. PR and agent runs only read them, so
        # build output from unreviewed code can never reach another run.
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: Packages/SnowflakeKit/.build
          key: spm-${{ steps.xcode.outputs.version }}-${{ github.sha }}

  build:
    name: Build
    runs-on: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: latest-stable
      - name: Xcode version (cache key)
        id: xcode
        run: echo "version=$(xcodebuild -version | tr '\n' ' ' | tr -cs 'A-Za-z0-9.' '-')" >> "$GITHUB_OUTPUT"
      - name: Restore DerivedData cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/DerivedData
          key: dd-${{ steps.xcode.outputs.version }}-${{ github.sha }}
          restore-keys: dd-${{ steps.xcode.outputs.version }}-
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Build (Debug)
        run: |
          xcodebuild -project Snowflake.xcodeproj -scheme Snowflake -configuration Debug \
            -derivedDataPath build/DerivedData CODE_SIGNING_ALLOWED=NO build
      - name: Save DerivedData cache
        # Only trusted pushes to main write caches. PR and agent runs only read them, so
        # build output from unreviewed code can never reach another run.
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/DerivedData
          key: dd-${{ steps.xcode.outputs.version }}-${{ github.sha }}

  screenshots:
    name: Screenshots
    runs-on: macos-26
    # Visual review aid, not a gate: download the artifact from the run summary.
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: latest-stable
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Build (Debug)
        run: |
          xcodegen generate
          xcodebuild -project Snowflake.xcodeproj -scheme Snowflake -configuration Debug \
            -derivedDataPath build/DerivedData CODE_SIGNING_ALLOWED=NO build
      - name: Capture UI states
        run: scripts/screenshots.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: screenshots
          path: build/screenshots/*.png
          if-no-files-found: warn
