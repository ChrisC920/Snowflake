name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build (e.g. v0.1.0)
        required: true

permissions:
  contents: write

jobs:
  release:
    name: Build and publish
    runs-on: macos-26
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
      - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: latest-stable
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Build (Release, ad-hoc signed)
        # TODO: Developer ID signing + notarization once secrets are set up:
        #   DEVELOPER_ID_CERT_P12, DEVELOPER_ID_CERT_PASSWORD, APPLE_TEAM_ID, NOTARY_API_KEY.
        run: |
          xcodegen generate
          xcodebuild -project Snowflake.xcodeproj -scheme Snowflake -configuration Release \
            -derivedDataPath build/DerivedData build
      - name: Package
        run: ditto -c -k --keepParent build/DerivedData/Build/Products/Release/Snowflake.app Snowflake.zip
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" Snowflake.zip --clobber
          else
            gh release create "$TAG" Snowflake.zip --title "Snowflake ${TAG#v}" --generate-notes
          fi
