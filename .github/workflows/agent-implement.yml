# Implements (or remediates) one issue on its own branch, in its own runner.
#
# Started only by agent-control.yml (or by a maintainer via "Run workflow"). Three jobs
# keep privileges apart:
#   prepare   (ubuntu, GITHUB_TOKEN)   checks the issue is still eligible and builds the task context
#   implement (macOS, read-only token) Claude edits, tests and commits locally; it never holds a write token
#   publish   (ubuntu, GitHub App)     enforces policy, pushes, opens or updates the PR, reports back
#
# One concurrency group per issue: different issues run in parallel, while the same issue
# never runs twice at once. agent-control.yml caps the total (AGENT_MAX_CONCURRENT).
name: Agent Implement
run-name: "Agent ${{ inputs.mode }} #${{ inputs.issue }}"

on:
  workflow_dispatch:
    inputs:
      issue:
        description: Issue number
        required: true
        type: string
      mode:
        description: implement a new change, or remediate the open PR
        type: choice
        options: [implement, remediate]
        default: implement
      request:
        description: Remediation request comment id (0 = none)
        type: string
        default: "0"

permissions: {}

concurrency:
  group: agent-issue-${{ inputs.issue }}
  cancel-in-progress: false

env:
  AGENT_BOT_LOGIN: ${{ vars.AGENT_BOT_LOGIN }}
  AGENTS_PAUSED: ${{ vars.AGENTS_PAUSED }}
  AGENT_MAX_IMPL_ATTEMPTS: ${{ vars.AGENT_MAX_IMPL_ATTEMPTS }}
  AGENT_MAX_TURNS: ${{ vars.AGENT_MAX_TURNS }}
  AGENT_MODEL: ${{ vars.AGENT_MODEL }}

jobs:
  prepare:
    name: Prepare
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
      pull-requests: read
      actions: read
      checks: read
      statuses: read
    outputs:
      proceed: ${{ steps.prep.outputs.proceed }}
      claude_args: ${{ steps.prep.outputs.claude_args }}
      checkout_ref: ${{ steps.prep.outputs.checkout_ref }}
      branch: ${{ steps.prep.outputs.branch }}
      base: ${{ steps.prep.outputs.base }}
      merge_base: ${{ steps.prep.outputs.merge_base }}
    steps:
      - name: Validate inputs
        env:
          ISSUE: ${{ inputs.issue }}
          REQUEST: ${{ inputs.request }}
        run: |
          [[ "$ISSUE" =~ ^[0-9]+$ && "$REQUEST" =~ ^[0-9]+$ ]] || { echo "::error::issue and request must be numbers"; exit 1; }
      - name: Check out agent tooling (default branch)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: .github/agent
          persist-credentials: false
      - name: Build task context
        id: prep
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ inputs.issue }}
          MODE: ${{ inputs.mode }}
          REQUEST: ${{ inputs.request }}
        run: |
          python3 .github/agent/agentctl.py prepare-implement --issue "$ISSUE" --mode "$MODE" --request "$REQUEST" --out "$RUNNER_TEMP/agent"
          cp -R .github/agent "$RUNNER_TEMP/agent/tools"
      - name: Upload task context
        if: steps.prep.outputs.proceed == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: agent-input
          path: ${{ runner.temp }}/agent
          retention-days: 7

  implement:
    name: Implement
    needs: prepare
    if: needs.prepare.outputs.proceed == 'true'
    runs-on: macos-26
    timeout-minutes: 100
    permissions:
      contents: read
    env:
      # Strip Anthropic, cloud and Actions credentials from every command Claude runs
      # (builds and tests execute code the agent wrote).
      CLAUDE_CODE_SUBPROCESS_ENV_SCRUB: "1"
    steps:
      - name: Check out work branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.checkout_ref }}
          fetch-depth: 0
          persist-credentials: false
      - name: Download task context
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: agent-input
          path: ${{ runner.temp }}/agent
      - name: Prepare workspace
        id: ws
        env:
          BRANCH: ${{ needs.prepare.outputs.branch }}
          BASE: ${{ needs.prepare.outputs.base }}
          MERGE_BASE: ${{ needs.prepare.outputs.merge_base }}
        run: |
          meta="$RUNNER_TEMP/agent/meta.json"
          git config user.name "$(python3 -c 'import json,sys;print(json.load(open(sys.argv[1]))["bot_name"])' "$meta")"
          git config user.email "$(python3 -c 'import json,sys;print(json.load(open(sys.argv[1]))["bot_email"])' "$meta")"
          if [ "$(git branch --show-current)" != "$BRANCH" ]; then git switch -c "$BRANCH"; fi
          mkdir -p .agent-context
          cp "$RUNNER_TEMP/agent/context.md" .agent-context/context.md
          echo ".agent-context/" >> .git/info/exclude
          if [ "$MERGE_BASE" = "true" ]; then
            git merge --no-edit "origin/$BASE" || echo "Merge has conflicts for the agent to resolve."
          fi
          delim="EOF_$(openssl rand -hex 8)"
          { echo "prompt<<$delim"; cat "$RUNNER_TEMP/agent/prompt.md"; echo "$delim"; } >> "$GITHUB_OUTPUT"
      - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: latest-stable
      - name: Install tools
        run: brew install xcodegen swiftlint swiftformat
      - name: Xcode version (cache key)
        id: xcode
        run: echo "version=$(xcodebuild -version | tr '\n' ' ' | tr -cs 'A-Za-z0-9.' '-')" >> "$GITHUB_OUTPUT"
      # Read-only: reuse build output that CI saved from main, so the agent's first
      # `make test` doesn't start cold. Agent runs never save caches.
      - name: Restore SwiftPM cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: Packages/SnowflakeKit/.build
          key: spm-${{ steps.xcode.outputs.version }}-${{ github.sha }}
          restore-keys: spm-${{ steps.xcode.outputs.version }}-
      - name: Restore DerivedData cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/DerivedData
          key: dd-${{ steps.xcode.outputs.version }}-${{ github.sha }}
          restore-keys: dd-${{ steps.xcode.outputs.version }}-
      - name: Run Claude
        id: claude
        continue-on-error: true
        uses: anthropics/claude-code-action@eb56b6666facdbd501035f4a0269d8caee2e7a8b # v1.0.289
        with:
          # Subscription auth only. No ANTHROPIC_API_KEY is configured, so nothing can fall back to API billing.
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Read-only token: the agent can read the repo but cannot push, comment or label.
          github_token: ${{ github.token }}
          # Runs are dispatched by Agent Control as github-actions[bot]; only this repo's own
          # workflows can act as that bot, and only after the maintainer checks in agentctl.
          allowed_bots: github-actions
          prompt: ${{ steps.ws.outputs.prompt }}
          claude_args: ${{ needs.prepare.outputs.claude_args }}
      - name: Classify outcome and bundle commits
        if: always()
        env:
          STRUCTURED_OUTPUT: ${{ steps.claude.outputs.structured_output }}
          EXECUTION_FILE: ${{ steps.claude.outputs.execution_file }}
        run: python3 "$RUNNER_TEMP/agent/tools/agentctl.py" finish-implement --dir "$RUNNER_TEMP/agent" --execution-file "$EXECUTION_FILE"
      - name: Upload result
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: agent-output
          path: |
            ${{ runner.temp }}/agent/result.json
            ${{ runner.temp }}/agent/agent.bundle
          if-no-files-found: ignore
          retention-days: 7

  publish:
    name: Publish
    needs: [prepare, implement]
    if: ${{ !cancelled() && needs.prepare.outputs.proceed == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      issues: write
      pull-requests: write
      actions: write
    steps:
      - name: Check out repository (default branch)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false
      - name: Download task context
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: agent-input
          path: ${{ runner.temp }}/agent
      - name: Download result
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: agent-output
          path: ${{ runner.temp }}/agent
      - name: Mint GitHub App token
        id: app
        continue-on-error: true  # publish-implement reports a missing token on the issue
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          client-id: ${{ vars.AGENT_APP_CLIENT_ID }}
          private-key: ${{ secrets.AGENT_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write
      - name: Push, open PR, report
        env:
          GH_TOKEN: ${{ github.token }}
          APP_TOKEN: ${{ steps.app.outputs.token }}
        run: python3 .github/agent/agentctl.py publish-implement --dir "$RUNNER_TEMP/agent" --repo-dir .
