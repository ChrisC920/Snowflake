# Independent AI review of agent PRs, in a separate Claude session with read-only tools.
#
# The result is a commit status, `agent/review`, on the exact head SHA. It is posted with
# GITHUB_TOKEN, so branch protection can require it from GitHub Actions only, and the
# implementing agent's GitHub App can't forge it. A new push means a new SHA and a new
# review. If the diff is byte-identical (for example after a clean "update branch"), the
# earlier passing verdict is reused instead of spending another Claude run.
name: Agent Review
run-name: "Agent review PR #${{ github.event.pull_request.number || inputs.pr }}"

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      pr:
        description: Pull request number
        required: true
        type: string

permissions: {}

concurrency:
  group: agent-review-${{ github.event.pull_request.number || inputs.pr }}
  cancel-in-progress: true

env:
  AGENT_BOT_LOGIN: ${{ vars.AGENT_BOT_LOGIN }}
  AGENTS_PAUSED: ${{ vars.AGENTS_PAUSED }}
  AGENT_REVIEW_MAX_TURNS: ${{ vars.AGENT_REVIEW_MAX_TURNS }}
  AGENT_REVIEW_MODEL: ${{ vars.AGENT_REVIEW_MODEL }}
  AGENT_MODEL: ${{ vars.AGENT_MODEL }}
  AGENT_REVIEW_BLOCKING: ${{ vars.AGENT_REVIEW_BLOCKING }}
  AGENT_REVIEW_HUMAN_PRS: ${{ vars.AGENT_REVIEW_HUMAN_PRS }}

jobs:
  prepare:
    name: Prepare
    # Fork PRs get no secrets and a read-only token, so they're skipped here (maintainers review those by hand).
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: read
      pull-requests: read
      statuses: write
    outputs:
      run: ${{ steps.prep.outputs.run }}
      sha: ${{ steps.prep.outputs.sha }}
      patch_id: ${{ steps.prep.outputs.patch_id }}
      claude_args: ${{ steps.prep.outputs.claude_args }}
      pr: ${{ steps.pr.outputs.pr }}
    steps:
      - name: Resolve PR number
        id: pr
        env:
          PR: ${{ github.event.pull_request.number || inputs.pr }}
        run: |
          [[ "$PR" =~ ^[0-9]+$ ]] || { echo "::error::pr must be a number"; exit 1; }
          echo "pr=$PR" >> "$GITHUB_OUTPUT"
      - name: Check out agent tooling (default branch)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: .github/agent
          path: _tools
          persist-credentials: false
      - name: Check out PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/pull/${{ steps.pr.outputs.pr }}/head
          path: pr
          fetch-depth: 0
          persist-credentials: false
      - name: Decide and build review context
        id: prep
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ steps.pr.outputs.pr }}
        run: |
          python3 _tools/.github/agent/agentctl.py prepare-review --pr "$PR" --repo-dir pr --out "$RUNNER_TEMP/review"
          mkdir -p "$RUNNER_TEMP/review" && cp -R _tools/.github/agent "$RUNNER_TEMP/review/tools"
      - name: Upload review context
        if: steps.prep.outputs.run == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: review-input
          path: ${{ runner.temp }}/review
          retention-days: 7

  review:
    name: Review
    needs: prepare
    if: needs.prepare.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: read
    env:
      CLAUDE_CODE_SUBPROCESS_ENV_SCRUB: "1"
    outputs:
      structured: ${{ steps.claude.outputs.structured_output }}
      usage_limit: ${{ steps.classify.outputs.usage_limit }}
    steps:
      - name: Check out PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Download review context
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: review-input
          path: ${{ runner.temp }}/review
      - name: Prepare workspace
        id: ws
        run: |
          mkdir -p .agent-context
          cp "$RUNNER_TEMP/review/context.md" .agent-context/context.md
          echo ".agent-context/" >> .git/info/exclude
          delim="EOF_$(openssl rand -hex 8)"
          { echo "prompt<<$delim"; cat "$RUNNER_TEMP/review/prompt.md"; echo "$delim"; } >> "$GITHUB_OUTPUT"
      - name: Run Claude (read-only reviewer)
        id: claude
        continue-on-error: true
        uses: anthropics/claude-code-action@eb56b6666facdbd501035f4a0269d8caee2e7a8b # v1.0.289
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ github.token }}
          # The PR author and pusher is the agent's GitHub App; only that bot may trigger this.
          allowed_bots: ${{ vars.AGENT_BOT_LOGIN }}
          prompt: ${{ steps.ws.outputs.prompt }}
          claude_args: ${{ needs.prepare.outputs.claude_args }}
      - name: Classify run
        id: classify
        if: always()
        env:
          EXECUTION_FILE: ${{ steps.claude.outputs.execution_file }}
        run: python3 "$RUNNER_TEMP/review/tools/agentctl.py" classify --execution-file "$EXECUTION_FILE"

  publish:
    name: Publish verdict
    needs: [prepare, review]
    if: ${{ !cancelled() && needs.prepare.outputs.run == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
      pull-requests: write
      statuses: write
      actions: write
    steps:
      - name: Check out agent tooling (default branch)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: .github/agent
          persist-credentials: false
      - name: Post status and findings
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ needs.prepare.outputs.pr }}
          SHA: ${{ needs.prepare.outputs.sha }}
          PATCH_ID: ${{ needs.prepare.outputs.patch_id }}
          STRUCTURED_OUTPUT: ${{ needs.review.outputs.structured }}
          USAGE_LIMIT: ${{ needs.review.outputs.usage_limit }}
        run: python3 .github/agent/agentctl.py publish-review --pr "$PR" --sha "$SHA" --patch-id "$PATCH_ID"
      - name: Wake the dispatcher
        env:
          GH_TOKEN: ${{ github.token }}
          REF: ${{ github.event.repository.default_branch }}
        run: gh workflow run agent-control.yml --repo "$GITHUB_REPOSITORY" --ref "$REF"
