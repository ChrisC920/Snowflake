# The control plane: a small, fast reconciler that decides what happens next.
#
# Every run reads the current state (labels, PRs, checks, reviews, the project board) and
# moves things forward. Because it works from state rather than from the triggering event,
# a dropped or duplicated event does no harm. It:
#   - delegates issues labeled agent-ready by a maintainer, in priority order, up to AGENT_MAX_CONCURRENT
#   - holds issues whose dependencies are still open
#   - gates agent PRs: draft → ready once CI and AI review pass on the exact head SHA, then
#     auto-merge (squash) waits for your approval
#   - queues bounded remediation for failed CI, AI review findings, conflicts or your requested changes
#   - updates branches that fell behind main, so they re-validate before merging
#   - recovers interrupted runs and pauses on subscription usage limits
#   - mirrors state onto the GitHub Project (Status, Priority, Type, Agent)
#
# Emergency stop: set the repository variable AGENTS_PAUSED=true.
name: Agent Control

on:
  issues:
    types: [opened, edited, labeled, unlabeled, closed, reopened]
  issue_comment:
    types: [created]
  pull_request_review:
    types: [submitted, dismissed]
  workflow_run:
    workflows: [CI]
    types: [completed]
  push:
    branches: [main]
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions: {}

env:
  AGENT_BOT_LOGIN: ${{ vars.AGENT_BOT_LOGIN }}
  AGENTS_PAUSED: ${{ vars.AGENTS_PAUSED }}
  AGENT_MAX_CONCURRENT: ${{ vars.AGENT_MAX_CONCURRENT }}
  AGENT_MAX_IMPL_ATTEMPTS: ${{ vars.AGENT_MAX_IMPL_ATTEMPTS }}
  AGENT_MAX_REMEDIATIONS: ${{ vars.AGENT_MAX_REMEDIATIONS }}
  AGENT_MAX_HUMAN_ROUNDS: ${{ vars.AGENT_MAX_HUMAN_ROUNDS }}
  AGENT_COOLDOWN_MINUTES: ${{ vars.AGENT_COOLDOWN_MINUTES }}
  AGENT_STALE_MINUTES: ${{ vars.AGENT_STALE_MINUTES }}
  AGENT_REQUIRED_CHECKS: ${{ vars.AGENT_REQUIRED_CHECKS }}
  AGENT_PROJECT_NUMBER: ${{ vars.AGENT_PROJECT_NUMBER }}
  AGENT_PROJECT_OWNER: ${{ vars.AGENT_PROJECT_OWNER }}

jobs:
  command:
    name: Command
    # Cheap pre-filter; agentctl re-checks the commenter's actual permission.
    if: >-
      github.event_name == 'issue_comment' &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association) &&
      (startsWith(github.event.comment.body, '/agent') || contains(github.event.comment.body, '@claude'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: agent-cmd-${{ github.event.issue.number }}
      cancel-in-progress: false
    permissions:
      contents: read
      issues: write
      pull-requests: write
      actions: write
      checks: read
      statuses: read
    steps:
      - name: Check out agent tooling (default branch)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: .github/agent
          persist-credentials: false
      - name: Handle command
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/agent/agentctl.py command

  reconcile:
    name: Reconcile
    if: >-
      github.event_name != 'issue_comment' &&
      (github.event_name != 'workflow_run' || startsWith(github.event.workflow_run.head_branch, 'agent/issue-'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # One reconciler at a time across the repo. A newer pending run replaces an older one;
    # that's safe because each run re-reads all state.
    concurrency:
      group: agent-control
      cancel-in-progress: false
    permissions:
      contents: read
      issues: write
      pull-requests: write
      actions: write
      checks: read
      statuses: write
    steps:
      - name: Check out agent tooling (default branch)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: .github/agent
          persist-credentials: false
      - name: Mint GitHub App token
        id: app
        if: vars.AGENT_APP_CLIENT_ID != ''
        continue-on-error: true
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          client-id: ${{ vars.AGENT_APP_CLIENT_ID }}
          private-key: ${{ secrets.AGENT_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - name: Reconcile
        env:
          GH_TOKEN: ${{ github.token }}
          APP_TOKEN: ${{ steps.app.outputs.token }}
          PROJECT_TOKEN: ${{ secrets.PROJECT_TOKEN }}
        run: python3 .github/agent/agentctl.py reconcile
