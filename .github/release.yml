# Categories for GitHub's auto-generated release notes.
changelog:
  exclude:
    labels: [ignore-for-release]
  categories:
    - title: New tools
      labels: [module]
    - title: Features
      labels: [enhancement]
    - title: Fixes
      labels: [bug]
    - title: Documentation
      labels: [docs]
    - title: Maintenance
      labels: [ci, dependencies]
    - title: Other changes
      labels: ["*"]
