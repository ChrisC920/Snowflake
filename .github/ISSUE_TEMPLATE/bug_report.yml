name: Bug report
description: Something isn't working as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Write this so an agent can do it without asking. When it's ready, add the **`agent-ready`** label to delegate it, or add **`human-only`** to keep agents away from it.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open the menu bar panel
        2. Click Keep Awake
        3. …
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Snowflake version
      description: Settings → About
      placeholder: 0.1.0 (1)
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version
      placeholder: macOS 27.0.1
    validations:
      required: true
  - type: dropdown
    id: tool
    attributes:
      label: Which part?
      options:
        - Menu bar panel
        - Settings
        - Keep Awake
        - Clipboard
        - Other
  - type: textarea
    id: extra
    attributes:
      label: Anything else?
      description: Screenshots, Console logs (subsystem com.chrisc920.Snowflake), crash reports.
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Checkable statements. The AI reviewer verifies each one, and the PR can't pass review while one is unmet.
      placeholder: |
        - [ ] The steps above no longer reproduce the problem
        - [ ] A regression test covers it
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Architectural context
      description: Relevant files, modules, patterns or docs (for example docs/ADDING_A_MODULE.md).
  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies
      description: "Write `Depends on #12` for each issue that must close first. An agent won't start until they're closed."
      placeholder: "Depends on #"
  - type: textarea
    id: constraints
    attributes:
      label: Constraints and out of scope
      description: What must not change, and what not to do.
  - type: textarea
    id: validation
    attributes:
      label: Expected validation
      description: Tests to add, commands to run, and UI states to check with `make screenshots`.
  - type: dropdown
    id: priority
    attributes:
      label: Priority
      description: Sets the matching priority label automatically.
      options: [Medium, High, Low]
      default: 0
