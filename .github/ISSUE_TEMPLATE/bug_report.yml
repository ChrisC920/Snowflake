name: Bug report
description: Something isn't working as expected
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open the menu bar panel
        2. Click Keep Awake
        3. …
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Snowflake version
      description: Settings → About
      placeholder: 0.1.0 (1)
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version
      placeholder: macOS 27.0.1
    validations:
      required: true
  - type: dropdown
    id: tool
    attributes:
      label: Which part?
      options:
        - Menu bar panel
        - Settings
        - Keep Awake
        - Clipboard
        - Other
  - type: textarea
    id: extra
    attributes:
      label: Anything else?
      description: Screenshots, Console logs (subsystem com.chrisc920.Snowflake), crash reports.
